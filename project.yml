name: PocketPantry
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  PocketPantry:
    type: application
    platform: iOS
    sources:
      - path: PocketPantry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketPantry
        PRODUCT_NAME: PocketPantry
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Pantry
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - PocketPantryTests
  PocketPantryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketPantryTests
    dependencies:
      - target: PocketPantry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketPantryTests
        GENERATE_INFOPLIST_FILE: YES

